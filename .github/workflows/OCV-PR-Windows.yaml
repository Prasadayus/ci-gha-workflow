name: OCV PR Windows

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/OCV-PR-Windows.yaml'
      # TODO: are following paths necessary?
      - 'checkout-and-merge/*'
      - 'configure-and-build/*'
      - 'run-tests/*'
      - 'scripts/runner.py'
      - 'scripts/test-plan.json'
  workflow_call:
    inputs:
      workflow_branch:
        description: "Branch for ci-gha-workflow repository"
        default: "main"
        required: false
        type: string

concurrency:
  group: OCV-PR-Windows-${{ github.ref }}
  cancel-in-progress: true

jobs:

  branch_eval:
    runs-on: ubuntu-24.04
    outputs:
      branches: ${{ steps.determine-branches.outputs.branches }}
    steps:
        - id: determine-branches
          shell: bash
          run: |
            # TEMP (diagnostic, REVERT before merge): both branches -- the
            # parallel.cpp partitioner fix now exists on the fork's 4.x and 5.x,
            # and each runs as its own parallel matrix job.
            echo "branches=[ '4.x', '5.x' ]" >> "$GITHUB_OUTPUT"

  Windows:
    runs-on: ${{ matrix.runner }}
    needs:
      - branch_eval
    strategy:
      # NOTE: Debugging
      # fail-fast: true
      fail-fast: false
      max-parallel: 3
      matrix:
        arch: [ arm64 ]
        config: [ base ]
        include:
          - arch: arm64
            config: base
            runner: windows-11-arm
            vs: 'Visual Studio 17 2022'
            cmake_arch: ARM64
            no_opencl: true

        branch: ${{ fromJSON(needs.branch_eval.outputs.branches )}}
    defaults:
      run:
        shell: bash
    # TEMP (diagnostic, REVERT before merge): -DWITH_OPENMP=ON removed from
    # CMAKE_OPT below so this build uses the DEFAULT parallel backend
    # (ms-concurrency/PPL) -- that is the backend under test. Adding OpenMP back
    # would sidestep the bug instead of exercising the fix.
    env:
      CMAKE_OPT: >-
        -DCL_Z_OPTION=/Z7
        -DBUILD_EXAMPLES=ON
        -DOPENCV_ENABLE_NONFREE=ON
        -DCMAKE_BUILD_TYPE=Release
        ${{ matrix.arch == 'arm64' && '-DCMAKE_ASM_COMPILER=CMAKE_ASM_COMPILER-NOTFOUND' || '' }}
        ${{ matrix.no_opencl && '-DWITH_OPENCL=OFF' || '' }}
        ${{ matrix.arch == 'x86' && '-DBUILD_opencv_python3=OFF' || '' }}
      # TEMP (diagnostic, REVERT before merge): forced to build-contrib. A
      # contrib build contains every main-module binary too, so ONE build serves
      # both the 'main' and 'contrib' test suites -- half the build time of
      # building 'build' and 'build-contrib' separately.
      MAIN_BUILD_DIR: "build-contrib"
      OPENCV_FOR_THREADS_NUM: 8
      CMAKE_BUILD_PARALLEL_LEVEL: 8

    # ==========

    steps:

    - name: Propagate environment
      run: |
        echo "GIT_CACHE=$(cygpath -u "$GIT_CACHE")" >> "$GITHUB_ENV"
        echo "DNN_MODELS=$(cygpath -u "$DNN_MODELS")" >> "$GITHUB_ENV"
        echo "BINARIES_CACHE=$(cygpath -u "$BINARIES_CACHE")" >> "$GITHUB_ENV"
        echo "OPENCV_DOWNLOAD_PATH=$(cygpath -u "$BINARIES_CACHE")" >> "$GITHUB_ENV"


    - name: Checkout workflow repository
      uses: actions/checkout@v4
      with:
        repository: opencv/ci-gha-workflow
        ref: "${{ github.repository == 'opencv/ci-gha-workflow' && github.ref || inputs.workflow_branch }}"

    - working-directory: '${{ github.workspace }}'
      shell: bash
      run: |
        ls -l
        export
        whoami
        id
        which bash
        echo "GIT_CACHE=$GIT_CACHE"
        echo "DNN_MODELS=$DNN_MODELS"
        echo "BINARIES_CACHE=$BINARIES_CACHE"
        echo "OPENCV_DOWNLOAD_PATH=$BINARIES_CACHE"


    - name: Checkout and merge OpenCV
      uses: ./checkout-and-merge
      with:
        target_branch: '${{ matrix.branch }}'
        author: '${{ github.event.pull_request.user.login }}'
        source_branch: "${{ github.event.repository.name == 'ci-gha-workflow' && '' || github.head_ref }}"
        gitcache: '${{ env.GIT_CACHE }}'
        workdir: '${{ github.workspace }}'

    # TEMP (diagnostic, REVERT before merge): this workflow is triggered by
    # pushing directly to ci-gha-workflow, so checkout-and-merge's own
    # author/source_branch fork-merge path never fires (it's gated on
    # github.event.repository.name != 'ci-gha-workflow', which is false
    # here) -- pull the fork commit in directly instead.
    #
    # Checked out directly (detached HEAD at this exact SHA) rather than
    # merged -- a merge creates a new, unpredictable commit hash each run,
    # which makes it hard to verify after the fact exactly what tree state
    # got built (CMake's "Version control:" line in the configure log won't
    # obviously match a merge commit's hash). Checking out the fork commit
    # directly means that line is directly traceable to a known, specific
    # SHA -- no ambiguity about what was actually tested.
    - name: (TEMP) Pin to partitioner-fix commit from opencv fork
      if: ${{ matrix.arch == 'arm64' }}
      working-directory: '${{ github.workspace }}/opencv'
      shell: bash
      run: |
        # Pull the fork's branch matching this matrix job (4.x or 5.x). Each
        # carries the same one-file change: modules/core/src/parallel.cpp stops
        # PPL picking its default auto_partitioner on ARM64, whose range-stealing
        # silently skips whole contiguous chunks of a parallel_for range. Unfixed
        # MSVC bug, developercommunity.visualstudio.com/t/1027444.
        #
        # Fetching by BRANCH rather than by SHA so one workflow serves both
        # matrix jobs and needs no edit when the fork is pushed again. The echo
        # plus CMake's "Version control:" line still record the exact commit
        # that was built, so it stays traceable after the fact.
        #
        # Fork branch per target:
        #   4.x -> probe/win-arm   (stock 4.x + the parallel.cpp change)
        #   5.x -> fix/ppl-arm     (stock 5.x + the parallel.cpp change)
        # The fork's own '4.x' and '5.x' branches track upstream and do NOT
        # carry the fix -- do not point this at them.
        git fetch https://github.com/Prasadayus/opencv.git ${{ matrix.branch == '4.x' && 'probe/win-arm' || 'fix/ppl-arm' }}
        git checkout FETCH_HEAD
        echo "Checked out commit: $(git rev-parse HEAD)"
        git log -1 --stat

    - name: Update extra dnn models
      if: ${{ matrix.arch != 'arm64' }}
      timeout-minutes: 60
      working-directory: '${{ github.workspace }}'
      run: |
        python opencv_extra/testdata/dnn/download_models.py \
          --cleanup \
          --dst '${{ env.DNN_MODELS }}/dnn'
        echo "OPENCV_DNN_TEST_DATA_PATH=${{ env.DNN_MODELS }}" >> $GITHUB_ENV

    # TEMP (diagnostic, REVERT before merge): the plain (non-contrib) build is
    # skipped -- the contrib build below produces every main-module binary as
    # well, so building both would double the build time for nothing.
    - if: false
      name: Configure and build OpenCV
      uses: ./configure-and-build
      with:
        workdir: '${{ github.workspace }}'
        builddir: 'build'
        generator: '${{ matrix.vs }}'
        options: '-A ${{ matrix.cmake_arch }} ${{ env.CMAKE_OPT }}'

    # This is the only build. It covers main + contrib modules, so both the
    # 'main' and 'contrib' test suites run against it (see MAIN_BUILD_DIR above).
    - if: ${{ github.event.repository.name != 'opencv_contrib' }}
      name: Configure and build OpenCV with contrib
      uses: ./configure-and-build
      with:
        workdir: '${{ github.workspace }}'
        builddir: 'build-contrib'
        generator: '${{ matrix.vs }}'
        options: '-A ${{ matrix.cmake_arch }} -DCMAKE_BUILD_TYPE=Release -DOPENCV_EXTRA_MODULES_PATH=opencv_contrib/modules ${{ env.CMAKE_OPT }}'

    - name: Run OpenCV tests
      uses: ./run-tests
      env:
        OPENCV_TEST_DATA_PATH: '${{ github.workspace }}/opencv_extra/testdata'
        OPENCV_TEST_REQUIRE_DATA: ${{ matrix.arch == 'arm64' && '0' || '1' }}
        OPENCV_TEST_CHECK_OPTIONAL_DATA: ${{ matrix.arch == 'arm64' && '0' || '1' }}
        PYTHONPATH: '${{ github.workspace }}/${{ env.MAIN_BUILD_DIR }}/python_loader:$PYTHONPATH'
        OPENCV_OPENCL_RUNTIME: 'disabled'
      with:
        workdir: '${{ github.workspace }}'
        builddir: '${{ env.MAIN_BUILD_DIR }}'
        logdir: '${{ github.workspace }}'
        plan: "test-plan-win-${{ matrix.branch }}.json"
        # TEMP (diagnostic, REVERT before merge): both suites. run-tests joins the
        # array into "--suite=main --suite=contrib", and the single build-contrib
        # tree contains the binaries for both.
        suite: "[ 'main', 'contrib' ]"
        enable_python: "false"
        enable_java: "false"
        filter: "[ 'windows-common' ]"
        suffix: '${{ matrix.arch }}_${{ matrix.branch }}'
        timeout: 15

    - if: ${{ always() && env.WARNINGS == '1' }}
      name: Warnings check
      run: |
        echo "::error Warnings have been found!"
        exit 1
