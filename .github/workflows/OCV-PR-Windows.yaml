name: OCV PR Windows

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/OCV-PR-Windows.yaml'
      # TODO: are following paths necessary?
      - 'checkout-and-merge/*'
      - 'configure-and-build/*'
      - 'run-tests/*'
      - 'scripts/runner.py'
      - 'scripts/test-plan.json'
  workflow_call:
    inputs:
      workflow_branch:
        description: "Branch for ci-gha-workflow repository"
        default: "main"
        required: false
        type: string

concurrency:
  group: OCV-PR-Windows-${{ github.ref }}
  cancel-in-progress: true

jobs:

  branch_eval:
    runs-on: ubuntu-24.04
    outputs:
      branches: ${{ steps.determine-branches.outputs.branches }}
    steps:
        - id: determine-branches
          shell: bash
          run: |
            if [ "${{ github.event.repository.name == 'ci-gha-workflow' }}" = "true" ] ; then
              echo "branches=[ '4.x', '5.x' ]" >> "$GITHUB_OUTPUT"
            else
              echo "branches=[ '${{ github.base_ref }}' ]" >> "$GITHUB_OUTPUT"
            fi

  Windows:
    runs-on: ${{ matrix.runner }}
    needs:
      - branch_eval
    strategy:
      # NOTE: Debugging
      # fail-fast: true
      fail-fast: false
      max-parallel: 3
      matrix:
        arch: [ arm64 ]
        config: [ base ]
        include:
          - arch: arm64
            config: base
            runner: windows-11-arm
            vs: 'Visual Studio 17 2022'
            cmake_arch: ARM64
            no_opencl: true

        branch: ${{ fromJSON(needs.branch_eval.outputs.branches )}}
    defaults:
      run:
        shell: bash
    env:
      CMAKE_OPT: >-
        -DCL_Z_OPTION=/Z7
        -DBUILD_EXAMPLES=ON
        -DOPENCV_ENABLE_NONFREE=ON
        -DCMAKE_BUILD_TYPE=Release
        ${{ matrix.no_opencl && '-DWITH_OPENCL=OFF' || '' }}
        ${{ matrix.arch == 'x86' && '-DBUILD_opencv_python3=OFF' || '' }}
      MAIN_BUILD_DIR: "${{ (github.event.repository.name != 'opencv_contrib') && 'build' || 'build-contrib' }}"
      OPENCV_FOR_THREADS_NUM: 8
      CMAKE_BUILD_PARALLEL_LEVEL: 8

    # ==========

    steps:

    - name: Propagate environment
      run: |
        echo "GIT_CACHE=$(cygpath -u "$GIT_CACHE")" >> "$GITHUB_ENV"
        echo "DNN_MODELS=$(cygpath -u "$DNN_MODELS")" >> "$GITHUB_ENV"
        echo "BINARIES_CACHE=$(cygpath -u "$BINARIES_CACHE")" >> "$GITHUB_ENV"
        echo "OPENCV_DOWNLOAD_PATH=$(cygpath -u "$BINARIES_CACHE")" >> "$GITHUB_ENV"


    - name: Checkout workflow repository
      uses: actions/checkout@v4
      with:
        repository: opencv/ci-gha-workflow
        ref: "${{ github.repository == 'opencv/ci-gha-workflow' && github.ref || inputs.workflow_branch }}"

    - working-directory: '${{ github.workspace }}'
      shell: bash
      run: |
        ls -l
        export
        whoami
        id
        which bash
        echo "GIT_CACHE=$GIT_CACHE"
        echo "DNN_MODELS=$DNN_MODELS"
        echo "BINARIES_CACHE=$BINARIES_CACHE"
        echo "OPENCV_DOWNLOAD_PATH=$BINARIES_CACHE"


    - name: Checkout and merge OpenCV
      uses: ./checkout-and-merge
      with:
        target_branch: '${{ matrix.branch }}'
        author: '${{ github.event.pull_request.user.login }}'
        source_branch: "${{ github.event.repository.name == 'ci-gha-workflow' && '' || github.head_ref }}"
        gitcache: '${{ env.GIT_CACHE }}'
        workdir: '${{ github.workspace }}'

    - name: Update extra dnn models
      if: ${{ matrix.arch != 'arm64' }}
      timeout-minutes: 60
      working-directory: '${{ github.workspace }}'
      run: |
        python opencv_extra/testdata/dnn/download_models.py \
          --cleanup \
          --dst '${{ env.DNN_MODELS }}/dnn'
        echo "OPENCV_DNN_TEST_DATA_PATH=${{ env.DNN_MODELS }}" >> $GITHUB_ENV

    - name: Remove MinGW from PATH (ARM64 MSVC build)
      if: ${{ matrix.arch == 'arm64' }}
      shell: bash
      run: echo "PATH=$(echo "$PATH" | tr ':' '\n' | grep -v -i '/mingw' | paste -sd ':')" >> "$GITHUB_ENV"

    - if: ${{ github.event.repository.name != 'opencv_contrib' }}
      name: Configure and build OpenCV
      uses: ./configure-and-build
      with:
        workdir: '${{ github.workspace }}'
        builddir: 'build'
        generator: '${{ matrix.vs }}'
        options: '-A ${{ matrix.cmake_arch }} ${{ env.CMAKE_OPT }}'

    - name: Configure and build OpenCV with contrib
      uses: ./configure-and-build
      with:
        workdir: '${{ github.workspace }}'
        builddir: 'build-contrib'
        generator: '${{ matrix.vs }}'
        options: '-A ${{ matrix.cmake_arch }} -DCMAKE_BUILD_TYPE=Release -DOPENCV_EXTRA_MODULES_PATH=opencv_contrib/modules ${{ env.CMAKE_OPT }}'

    - name: Run OpenCV tests
      uses: ./run-tests
      env:
        OPENCV_TEST_DATA_PATH: '${{ github.workspace }}/opencv_extra/testdata'
        OPENCV_TEST_REQUIRE_DATA: ${{ matrix.arch == 'arm64' && '0' || '1' }}
        OPENCV_TEST_CHECK_OPTIONAL_DATA: ${{ matrix.arch == 'arm64' && '0' || '1' }}
        PYTHONPATH: '${{ github.workspace }}/${{ env.MAIN_BUILD_DIR }}/python_loader:$PYTHONPATH'
        OPENCV_OPENCL_RUNTIME: 'disabled'
      with:
        workdir: '${{ github.workspace }}'
        builddir: '${{ env.MAIN_BUILD_DIR }}'
        logdir: '${{ github.workspace }}'
        plan: "test-plan-win-${{ matrix.branch }}.json"
        suite: "[ ${{ (github.event.repository.name == 'opencv_contrib') && '''contrib'''  || '''main''' }} ]"
        enable_python: "false"
        enable_java: "false"
        filter: "[ 'windows-common' ]"
        suffix: '${{ matrix.arch }}_${{ matrix.branch }}'
        timeout: 15

    # ============================================================
    # TEMPORARY diagnostic — REVERT before the upstream PR.
    # Re-runs the known-failing tests against the ALREADY-BUILT binaries with
    # OPENCV_CPU_DISABLE toggled to pinpoint WHICH dispatched NEON kernel
    # (FP16 / BF16 / DOTPROD) miscomputes on the Neoverse-N2 runner.
    # A config whose column drops a module's "failed" to 0 = the culprit.
    # ============================================================
    - name: SIMD dispatch A/B diagnostic (ARM64, TEMPORARY)
      if: ${{ always() && matrix.arch == 'arm64' }}
      shell: pwsh
      working-directory: '${{ github.workspace }}'
      run: |
        $env:OPENCV_TEST_DATA_PATH           = "${{ github.workspace }}/opencv_extra/testdata"
        $env:OPENCV_TEST_REQUIRE_DATA        = "0"
        $env:OPENCV_TEST_CHECK_OPTIONAL_DATA = "0"
        $env:OPENCV_FOR_THREADS_NUM          = "4"
        $bin = "build/bin/Release"
        New-Item -ItemType Directory -Force ab_logs | Out-Null

        $imgSeed = "0x00000000000c5aca"; $coreSeed = "0x00000000000c5a61"
        $modules = @(
          @{ name="imgproc";   exe="$bin/opencv_test_imgproc.exe";   seed=$imgSeed;  filter="*ColorYUV*:Imgproc_Remap.accuracy:*FindTRUContours*:*RemapRelative*:*MatchTemplateWithMask*:*Equalize_Hist*" }
          @{ name="core";      exe="$bin/opencv_test_core.exe";      seed=$coreSeed; filter="Core_Reduce.accuracy" }
          @{ name="objdetect"; exe="$bin/opencv_test_objdetect.exe"; seed=$imgSeed;  filter="CV_*Aruco*:CV_*Charuco*:CV_*April*:Objdetect_QRCode_Encode_Decode.regression" }
          @{ name="ptcloud";   exe="$bin/opencv_test_ptcloud.exe";   seed=$imgSeed;  filter="*VolumeTestFixture.fetch_normals*" }
          @{ name="geometry";  exe="$bin/opencv_test_geometry.exe";  seed=$imgSeed;  filter="Calib3d_InitUndistortMap.accuracy:Calib3d_UndistortImgproc.accuracy" }
          @{ name="video";     exe="$bin/opencv_test_video.exe";     seed=$imgSeed;  filter="*Video_ECC.accuracy*" }
          @{ name="stitching"; exe="$bin/opencv_test_stitching.exe"; seed=$imgSeed;  filter="ImageStitcher.setTransform" }
          @{ name="dnn";       exe="$bin/opencv_test_dnn.exe";       seed=$imgSeed;  filter="*TESTKVCache.layouts*" }
        )
        $configs = [ordered]@{
          "00_baseline"        = ""
          "01_disable_ALL"     = "NEON_FP16,NEON_BF16,NEON_DOTPROD"
          "02_disable_FP16"    = "NEON_FP16"
          "03_disable_BF16"    = "NEON_BF16"
          "04_disable_DOTPROD" = "NEON_DOTPROD"
        }

        $results = @{}
        foreach ($cfg in $configs.Keys) {
          $env:OPENCV_CPU_DISABLE = $configs[$cfg]
          Write-Host "==== CONFIG $cfg   OPENCV_CPU_DISABLE='$($configs[$cfg])' ===="
          foreach ($m in $modules) {
            $env:OPENCV_TEST_SEED = $m.seed
            $log = "ab_logs/${cfg}_$($m.name).log"
            if (Test-Path $m.exe) {
              & $m.exe --skip_unstable=1 --gtest_filter="$($m.filter)" *> $log
              $fL = Select-String $log -Pattern "^\[  FAILED  \] (\d+) test" | Select-Object -First 1
              $pL = Select-String $log -Pattern "^\[  PASSED  \] (\d+) test" | Select-Object -First 1
              $f = if ($fL) { [int]$fL.Matches[0].Groups[1].Value } else { 0 }
              $p = if ($pL) { [int]$pL.Matches[0].Groups[1].Value } else { 0 }
              $results["$($m.name)|$cfg"] = "$p/$f"
            } else {
              $results["$($m.name)|$cfg"] = "NOEXE"
            }
            Write-Host ("  {0,-10} -> {1}" -f $m.name, $results["$($m.name)|$cfg"])
          }
        }

        $rows = @()
        foreach ($m in $modules) {
          $r = [ordered]@{ Module = $m.name }
          foreach ($c in $configs.Keys) { $r[$c] = $results["$($m.name)|$c"] }
          $rows += [pscustomobject]$r
        }
        Write-Host ""
        Write-Host "################  SUMMARY (cell = passed/failed)  ################"
        $rows | Format-Table -AutoSize -Wrap | Out-String -Width 4096 | Write-Host
        Write-Host "Baseline (00) should show failures. The config that drops a module's"
        Write-Host "'failed' to 0 identifies the broken dispatched kernel for that module."

    - name: Upload A/B logs (ARM64, TEMPORARY)
      if: ${{ always() && matrix.arch == 'arm64' }}
      uses: actions/upload-artifact@v4
      with:
        name: simd-ab-logs
        path: ab_logs/

    - if: ${{ always() && env.WARNINGS == '1' }}
      name: Warnings check
      run: |
        echo "::error Warnings have been found!"
        exit 1
