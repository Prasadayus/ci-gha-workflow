name: OCV PR Windows

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/OCV-PR-Windows.yaml'
      # TODO: are following paths necessary?
      - 'checkout-and-merge/*'
      - 'configure-and-build/*'
      - 'run-tests/*'
      - 'scripts/runner.py'
      - 'scripts/test-plan.json'
  workflow_call:
    inputs:
      workflow_branch:
        description: "Branch for ci-gha-workflow repository"
        default: "main"
        required: false
        type: string

concurrency:
  group: OCV-PR-Windows-${{ github.ref }}
  cancel-in-progress: true

jobs:

  branch_eval:
    runs-on: ubuntu-24.04
    outputs:
      branches: ${{ steps.determine-branches.outputs.branches }}
    steps:
        - id: determine-branches
          shell: bash
          run: |
            # TEMP (diagnostic, REVERT before merge): 4.x only -- validating
            # the contours_truco.cpp / pencil-sketch / initInterTab2D fixes,
            # which currently live on the 4.x fork commit being pulled in
            # below. 5.x would need its own port (contours_truco.cpp has
            # already diverged between branches).
            echo "branches=[ '4.x' ]" >> "$GITHUB_OUTPUT"

  Windows:
    runs-on: ${{ matrix.runner }}
    needs:
      - branch_eval
    strategy:
      # NOTE: Debugging
      # fail-fast: true
      fail-fast: false
      max-parallel: 3
      matrix:
        arch: [ arm64 ]
        config: [ base ]
        include:
          - arch: arm64
            config: base
            runner: windows-11-arm
            vs: 'Visual Studio 17 2022'
            cmake_arch: ARM64
            no_opencl: true

        branch: ${{ fromJSON(needs.branch_eval.outputs.branches )}}
    defaults:
      run:
        shell: bash
    # TEMP (diagnostic, REVERT before merge): -DWITH_OPENMP=ON removed from
    # CMAKE_OPT below so this build uses the DEFAULT parallel backend
    # (ms-concurrency/PPL), to check the core-latency probe's numbers against
    # the default build rather than only the already-fixed OpenMP build.
    env:
      CMAKE_OPT: >-
        -DCL_Z_OPTION=/Z7
        -DBUILD_EXAMPLES=ON
        -DOPENCV_ENABLE_NONFREE=ON
        -DCMAKE_BUILD_TYPE=Release
        ${{ matrix.arch == 'arm64' && '-DCMAKE_ASM_COMPILER=CMAKE_ASM_COMPILER-NOTFOUND' || '' }}
        ${{ matrix.no_opencl && '-DWITH_OPENCL=OFF' || '' }}
        ${{ matrix.arch == 'x86' && '-DBUILD_opencv_python3=OFF' || '' }}
      MAIN_BUILD_DIR: "${{ (github.event.repository.name != 'opencv_contrib') && 'build' || 'build-contrib' }}"
      OPENCV_FOR_THREADS_NUM: 8
      CMAKE_BUILD_PARALLEL_LEVEL: 8

    # ==========

    steps:

    - name: Propagate environment
      run: |
        echo "GIT_CACHE=$(cygpath -u "$GIT_CACHE")" >> "$GITHUB_ENV"
        echo "DNN_MODELS=$(cygpath -u "$DNN_MODELS")" >> "$GITHUB_ENV"
        echo "BINARIES_CACHE=$(cygpath -u "$BINARIES_CACHE")" >> "$GITHUB_ENV"
        echo "OPENCV_DOWNLOAD_PATH=$(cygpath -u "$BINARIES_CACHE")" >> "$GITHUB_ENV"


    - name: Checkout workflow repository
      uses: actions/checkout@v4
      with:
        repository: opencv/ci-gha-workflow
        ref: "${{ github.repository == 'opencv/ci-gha-workflow' && github.ref || inputs.workflow_branch }}"

    - working-directory: '${{ github.workspace }}'
      shell: bash
      run: |
        ls -l
        export
        whoami
        id
        which bash
        echo "GIT_CACHE=$GIT_CACHE"
        echo "DNN_MODELS=$DNN_MODELS"
        echo "BINARIES_CACHE=$BINARIES_CACHE"
        echo "OPENCV_DOWNLOAD_PATH=$BINARIES_CACHE"


    - name: Checkout and merge OpenCV
      uses: ./checkout-and-merge
      with:
        target_branch: '${{ matrix.branch }}'
        author: '${{ github.event.pull_request.user.login }}'
        source_branch: "${{ github.event.repository.name == 'ci-gha-workflow' && '' || github.head_ref }}"
        gitcache: '${{ env.GIT_CACHE }}'
        workdir: '${{ github.workspace }}'

    # TEMP (diagnostic, REVERT before merge): this workflow is triggered by
    # pushing directly to ci-gha-workflow, so checkout-and-merge's own
    # author/source_branch fork-merge path never fires (it's gated on
    # github.event.repository.name != 'ci-gha-workflow', which is false
    # here) -- pull the fork commit in directly instead, same as the earlier
    # cherry-pick step did. Prasadayus/opencv#64: contours_truco.cpp
    # connected-components redesign + pencil-sketch stale-variable fix +
    # initInterTab2D std::call_once fix, all currently on 4.x.
    #
    # Checked out directly (detached HEAD at this exact SHA) rather than
    # merged -- a merge creates a new, unpredictable commit hash each run,
    # which makes it hard to verify after the fact exactly what tree state
    # got built (CMake's "Version control:" line in the configure log won't
    # obviously match a merge commit's hash). Checking out the fork commit
    # directly means that line is directly traceable to a known, specific
    # SHA -- no ambiguity about what was actually tested.
    - name: (TEMP) Pin to diagnostics commit from opencv fork
      if: ${{ matrix.arch == 'arm64' }}
      working-directory: '${{ github.workspace }}/opencv'
      shell: bash
      run: |
        # 1c08400f4d = c301419e35 (the three fixes: contours_truco.cpp
        # connected-components redesign, npr.hpp stale-temp fix, imgwarp.cpp
        # call_once) PLUS the OpenCV-vs-PPL diagnostics run by the steps at the
        # end of this job: ppl_contract_audit.cpp,
        # modules/imgproc/test/test_parallel_backend_ab.cpp, and a DISABLED_
        # ColorYUV size sweep in test_cvtyuv.cpp (inert -- nothing invokes it).
        #
        # History, so nobody re-runs a superseded commit:
        #   f3caf9e9d1 - first diagnostics. Stripe audit found 27 skipped stripes
        #                but had NO control, and printed "CONCLUSIVE" wrongly.
        #   b72a1cc689 - added the std::thread control + proof-of-life counters.
        #                RESULT: 112 stripes lost under the built-in backend in
        #                CONTIGUOUS runs (worst: 86 consecutive, 911..996, the
        #                entire tail, at nthreads=4), control clean at 0. That is
        #                the finding. But the A/B step HUNG (>58 min vs 1m09s the
        #                run before) on repeated scheduler create/destroy.
        #   1c08400f4d - this one. Two fixes: (a) the standalone audit now runs
        #                997 tasks at EVERY thread count -- it previously scaled
        #                tasks with threads (64 tasks at 4 threads) and so never
        #                exercised the combination that actually fails, which is
        #                why it looked like it exonerated PPL; (b) the A/B test
        #                hoists the thread-count loop outermost, cutting
        #                setNumThreads calls from 764 to ~39 per backend (the
        #                suspected cause of the hang), and prints per-count
        #                progress so a hang is distinguishable from slow work.
        #
        # What this run decides: if the audit reports "[2] indices never
        # executed > 0" at 997 tasks, raw Concurrency::parallel_for is failing to
        # execute part of its own range with NO OpenCV linked -> PPL's bug,
        # proven. If it stays clean, the defect is in how OpenCV drives PPL
        # (Attach/Detach at parallel.cpp:600-609, or the global pplScheduler that
        # setNumThreads destroys and recreates at :762-767).
        #
        # Expect CMake's "Version control:" line to read 4.14.0-<n>-g1c08400f4d.
        git fetch https://github.com/Prasadayus/opencv.git 1c08400f4d7ec80dd30f9455c2b14946b2fb1ac2
        git checkout FETCH_HEAD
        echo "Checked out commit: $(git rev-parse HEAD)"
        git log -1 --stat

    - name: Update extra dnn models
      if: ${{ matrix.arch != 'arm64' }}
      timeout-minutes: 60
      working-directory: '${{ github.workspace }}'
      run: |
        python opencv_extra/testdata/dnn/download_models.py \
          --cleanup \
          --dst '${{ env.DNN_MODELS }}/dnn'
        echo "OPENCV_DNN_TEST_DATA_PATH=${{ env.DNN_MODELS }}" >> $GITHUB_ENV

    - if: ${{ github.event.repository.name != 'opencv_contrib' }}
      name: Configure and build OpenCV
      uses: ./configure-and-build
      with:
        workdir: '${{ github.workspace }}'
        builddir: 'build'
        generator: '${{ matrix.vs }}'
        options: '-A ${{ matrix.cmake_arch }} ${{ env.CMAKE_OPT }}'

    # TEMP (diagnostic, REVERT before merge): skip the contrib build for faster
    # iteration on the OpenCV-vs-PPL diagnostics further down. None of them
    # touch contrib modules, so building it only costs wall-clock time.
    - if: false
      name: Configure and build OpenCV with contrib
      uses: ./configure-and-build
      with:
        workdir: '${{ github.workspace }}'
        builddir: 'build-contrib'
        generator: '${{ matrix.vs }}'
        options: '-A ${{ matrix.cmake_arch }} -DCMAKE_BUILD_TYPE=Release -DOPENCV_EXTRA_MODULES_PATH=opencv_contrib/modules ${{ env.CMAKE_OPT }}'

    # TEMP (diagnostic, REVERT before merge): the real, unmodified OpenCV test
    # this whole investigation started from -- repeated 2000x in one process.
    # Kept as a control: it exercises OpenCV's full layered dispatch with a
    # real-sized context object, and it failed once on Alexander's official 4.x
    # CI run, which has never been explained. It has since come back clean here
    # (0/2000) and clean on a local Snapdragon, so it is a regression watch
    # rather than an open lead. Drop it if CI wall-clock becomes a problem.
    - name: (TEMP) Run Core_Rand.parallel_for_stable_results repeated
      if: ${{ always() && matrix.arch == 'arm64' }}
      working-directory: '${{ github.workspace }}'
      shell: bash
      run: ./build/bin/Release/opencv_test_core.exe --gtest_filter='Core_Rand.parallel_for_stable_results' --gtest_repeat=2000

    # =========================================================================
    # TEMP (diagnostic, REVERT before merge): the three steps below are the
    # decisive experiment for "is this OpenCV's bug or PPL's?".
    #
    # Everything below has already been run on the developer's Snapdragon X
    # (Oryon) machine, pinned to 4 CPUs to match this runner's vCPU count, and
    # came back completely clean:
    #   - the real FindTRUContours tests, 400 executions  -> 0 failures
    #   - the A/B backend swap, 760 comparisons/backend    -> 0 divergence
    #   - stripe delivery, ~10M stripes                    -> all correct
    #   - the standalone PPL contract audit, ~30M dispatches -> all 4 guarantees held
    # And the input images are provably identical to CI's, because
    # modules/ts/src/ts.cpp:790 (testSetUp) resets theRNG to a fixed
    # cvtest::param_seed before every single test.
    #
    # So core count, input images, test parameters, thread counts and PPL's
    # task-delivery contract are all eliminated as explanations. The one
    # remaining difference is the SILICON: Cobalt 100 / Neoverse N2 here versus
    # Oryon there. Every PPL test so far ran on Oryon; PPL-on-Cobalt has never
    # been tested. These steps test it.
    #
    # HOW TO READ THE RESULTS:
    #   Contract audit FAILS here  -> PPL breaks its documented contract on this
    #                                 silicon and not on Oryon. No OpenCV is
    #                                 linked into that binary, so this is PROOF
    #                                 the defect is PPL's, not OpenCV's.
    #   Contract audit PASSES here -> PPL's guarantees hold on Cobalt too, yet
    #                                 the OpenCV tests still fail => the
    #                                 divergence comes from OpenCV's own memory
    #                                 access being exposed by Neoverse N2's
    #                                 ordering => OpenCV's defect. Next step
    #                                 would be a per-pixel write-ownership
    #                                 detector in contours_truco.cpp.
    # Either outcome settles the question.
    # =========================================================================

    # No OpenCV linked at all -- that is the whole point. Audits the four PPL
    # guarantees OpenCV's parallel_for_ silently relies on: caller->worker
    # visibility, exactly-once delivery, worker->caller visibility after the
    # join, and multi-word write integrity. Mirrors OpenCV's own scheduler
    # policy (parallel.cpp:764), per-call Attach/Detach (parallel.cpp:598-609)
    # and one-index-per-task dispatch shape (parallel.cpp:447-450).
    # Exits non-zero on a contract violation, so the step fails loudly.
    - name: (TEMP) PPL contract audit (no OpenCV linked)
      if: ${{ always() && matrix.arch == 'arm64' }}
      working-directory: '${{ github.workspace }}/opencv'
      shell: cmd
      run: |
        rem Locate VS via vswhere rather than hardcoding an edition path. The CI
        rem log shows the compiler under .../2022/Enterprise/..., but hardcoding
        rem that makes this step die outright if the runner image ever changes
        rem edition -- and a dead step teaches us nothing.
        set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
        if not exist "%VSWHERE%" set "VSWHERE=%ProgramFiles%\Microsoft Visual Studio\Installer\vswhere.exe"
        set "VSPATH="
        if exist "%VSWHERE%" for /f "usebackq tokens=*" %%i in (`"%VSWHERE%" -latest -property installationPath`) do set "VSPATH=%%i"
        if not defined VSPATH set "VSPATH=C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
        echo Using VS at: %VSPATH%
        if not exist "%VSPATH%\VC\Auxiliary\Build\vcvarsall.bat" (
          echo ERROR: vcvarsall.bat not found under "%VSPATH%"
          exit /b 1
        )
        call "%VSPATH%\VC\Auxiliary\Build\vcvarsall.bat" arm64
        if errorlevel 1 ( echo ERROR: vcvarsall failed & exit /b 1 )
        cl /EHsc /O2 /std:c++17 ppl_contract_audit.cpp
        if errorlevel 1 ( echo ERROR: compile failed & exit /b 1 )
        ppl_contract_audit.exe

    # In-situ counterpart to the above: goes through OpenCV's real production
    # cv::parallel_for_ with a body that only records what happened. 997 stripes
    # (prime, so no chunking divides it evenly) x 2000 trials per thread count.
    # OpenCV fixes the stripe count BEFORE dispatch, so a skipped or duplicated
    # stripe cannot be an OpenCV defect -- a failure here is conclusive for PPL
    # on its own.
    - name: (TEMP) Stripe delivery audit
      if: ${{ always() && matrix.arch == 'arm64' }}
      working-directory: '${{ github.workspace }}'
      shell: bash
      run: ./build/bin/Release/opencv_test_imgproc.exe --gtest_also_run_disabled_tests --gtest_filter='*stripe_delivery_audit*'

    # The substitution experiment, run where the failure actually reproduces.
    # Swaps ONLY the thread pool (a plain std::thread pool, via the public
    # cv::parallel::setParallelForBackend) while holding the stripe count,
    # stripe->Range mapping, RNG propagation and exception capture identical --
    # a custom backend's parallel_for_cb(i, i+1) reaches the very same
    # ParallelLoopBodyWrapper::operator()(Range(i, i+1)) that PPL's
    # ProxyLoopBody::operator()(int i) produces.
    #   Both backends diverge -> OpenCV defect, proven (fails with PPL removed).
    #   Only the built-in diverges -> strong evidence for the runtime.
    # Note this reports rather than asserts on the built-in backend, so the step
    # passing does NOT mean "no problem" -- read the printed verdict block.
    - name: (TEMP) Backend A/B swap (PPL vs std::thread)
      if: ${{ always() && matrix.arch == 'arm64' }}
      working-directory: '${{ github.workspace }}'
      shell: bash
      run: ./build/bin/Release/opencv_test_imgproc.exe --gtest_also_run_disabled_tests --gtest_filter='*findContours_ppl_vs_stdthread*'

    - name: Run OpenCV tests
      uses: ./run-tests
      env:
        OPENCV_TEST_DATA_PATH: '${{ github.workspace }}/opencv_extra/testdata'
        OPENCV_TEST_REQUIRE_DATA: ${{ matrix.arch == 'arm64' && '0' || '1' }}
        OPENCV_TEST_CHECK_OPTIONAL_DATA: ${{ matrix.arch == 'arm64' && '0' || '1' }}
        PYTHONPATH: '${{ github.workspace }}/${{ env.MAIN_BUILD_DIR }}/python_loader:$PYTHONPATH'
        OPENCV_OPENCL_RUNTIME: 'disabled'
      with:
        workdir: '${{ github.workspace }}'
        builddir: '${{ env.MAIN_BUILD_DIR }}'
        logdir: '${{ github.workspace }}'
        plan: "test-plan-win-${{ matrix.branch }}.json"
        suite: "[ ${{ (github.event.repository.name == 'opencv_contrib') && '''contrib'''  || '''main''' }} ]"
        enable_python: "false"
        enable_java: "false"
        filter: "[ 'windows-common' ]"
        suffix: '${{ matrix.arch }}_${{ matrix.branch }}'
        timeout: 15

    - if: ${{ always() && env.WARNINGS == '1' }}
      name: Warnings check
      run: |
        echo "::error Warnings have been found!"
        exit 1
