name: OCV PR Windows

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/OCV-PR-Windows.yaml'
      # TODO: are following paths necessary?
      - 'checkout-and-merge/*'
      - 'configure-and-build/*'
      - 'run-tests/*'
      - 'scripts/runner.py'
      - 'scripts/test-plan.json'
  workflow_call:
    inputs:
      workflow_branch:
        description: "Branch for ci-gha-workflow repository"
        default: "main"
        required: false
        type: string

concurrency:
  group: OCV-PR-Windows-${{ github.ref }}
  cancel-in-progress: true

jobs:

  branch_eval:
    runs-on: ubuntu-24.04
    outputs:
      branches: ${{ steps.determine-branches.outputs.branches }}
    steps:
        - id: determine-branches
          shell: bash
          run: |
            # TEMP (diagnostic, REVERT before merge): 4.x only -- validating
            # the contours_truco.cpp / pencil-sketch / initInterTab2D fixes,
            # which currently live on the 4.x fork commit being pulled in
            # below. 5.x would need its own port (contours_truco.cpp has
            # already diverged between branches).
            echo "branches=[ '4.x' ]" >> "$GITHUB_OUTPUT"

  Windows:
    runs-on: ${{ matrix.runner }}
    needs:
      - branch_eval
    strategy:
      # NOTE: Debugging
      # fail-fast: true
      fail-fast: false
      max-parallel: 3
      matrix:
        arch: [ arm64 ]
        config: [ base ]
        include:
          - arch: arm64
            config: base
            runner: windows-11-arm
            vs: 'Visual Studio 17 2022'
            cmake_arch: ARM64
            no_opencl: true

        branch: ${{ fromJSON(needs.branch_eval.outputs.branches )}}
    defaults:
      run:
        shell: bash
    # TEMP (diagnostic, REVERT before merge): -DWITH_OPENMP=ON removed from
    # CMAKE_OPT below so this build uses the DEFAULT parallel backend
    # (ms-concurrency/PPL), to check the core-latency probe's numbers against
    # the default build rather than only the already-fixed OpenMP build.
    env:
      CMAKE_OPT: >-
        -DCL_Z_OPTION=/Z7
        -DBUILD_EXAMPLES=ON
        -DOPENCV_ENABLE_NONFREE=ON
        -DCMAKE_BUILD_TYPE=Release
        ${{ matrix.arch == 'arm64' && '-DCMAKE_ASM_COMPILER=CMAKE_ASM_COMPILER-NOTFOUND' || '' }}
        ${{ matrix.no_opencl && '-DWITH_OPENCL=OFF' || '' }}
        ${{ matrix.arch == 'x86' && '-DBUILD_opencv_python3=OFF' || '' }}
      MAIN_BUILD_DIR: "${{ (github.event.repository.name != 'opencv_contrib') && 'build' || 'build-contrib' }}"
      OPENCV_FOR_THREADS_NUM: 8
      CMAKE_BUILD_PARALLEL_LEVEL: 8

    # ==========

    steps:

    - name: Propagate environment
      run: |
        echo "GIT_CACHE=$(cygpath -u "$GIT_CACHE")" >> "$GITHUB_ENV"
        echo "DNN_MODELS=$(cygpath -u "$DNN_MODELS")" >> "$GITHUB_ENV"
        echo "BINARIES_CACHE=$(cygpath -u "$BINARIES_CACHE")" >> "$GITHUB_ENV"
        echo "OPENCV_DOWNLOAD_PATH=$(cygpath -u "$BINARIES_CACHE")" >> "$GITHUB_ENV"


    - name: Checkout workflow repository
      uses: actions/checkout@v4
      with:
        repository: opencv/ci-gha-workflow
        ref: "${{ github.repository == 'opencv/ci-gha-workflow' && github.ref || inputs.workflow_branch }}"

    - working-directory: '${{ github.workspace }}'
      shell: bash
      run: |
        ls -l
        export
        whoami
        id
        which bash
        echo "GIT_CACHE=$GIT_CACHE"
        echo "DNN_MODELS=$DNN_MODELS"
        echo "BINARIES_CACHE=$BINARIES_CACHE"
        echo "OPENCV_DOWNLOAD_PATH=$BINARIES_CACHE"


    - name: Checkout and merge OpenCV
      uses: ./checkout-and-merge
      with:
        target_branch: '${{ matrix.branch }}'
        author: '${{ github.event.pull_request.user.login }}'
        source_branch: "${{ github.event.repository.name == 'ci-gha-workflow' && '' || github.head_ref }}"
        gitcache: '${{ env.GIT_CACHE }}'
        workdir: '${{ github.workspace }}'

    # TEMP (diagnostic, REVERT before merge): this workflow is triggered by
    # pushing directly to ci-gha-workflow, so checkout-and-merge's own
    # author/source_branch fork-merge path never fires (it's gated on
    # github.event.repository.name != 'ci-gha-workflow', which is false
    # here) -- pull the fork commit in directly instead, same as the earlier
    # cherry-pick step did. Prasadayus/opencv#64: contours_truco.cpp
    # connected-components redesign + pencil-sketch stale-variable fix +
    # initInterTab2D std::call_once fix, all currently on 4.x.
    #
    # Checked out directly (detached HEAD at this exact SHA) rather than
    # merged -- a merge creates a new, unpredictable commit hash each run,
    # which makes it hard to verify after the fact exactly what tree state
    # got built (CMake's "Version control:" line in the configure log won't
    # obviously match a merge commit's hash). Checking out the fork commit
    # directly means that line is directly traceable to a known, specific
    # SHA -- no ambiguity about what was actually tested.
    - name: (TEMP) Pin to confirmed fixes commit from opencv fork
      if: ${{ matrix.arch == 'arm64' }}
      working-directory: '${{ github.workspace }}/opencv'
      shell: bash
      run: |
        git fetch https://github.com/Prasadayus/opencv.git c301419e35b2419067a2ff2677945dbd153581ef
        git checkout FETCH_HEAD
        echo "Checked out commit: $(git rev-parse HEAD)"
        git log -1 --stat

    - name: Update extra dnn models
      if: ${{ matrix.arch != 'arm64' }}
      timeout-minutes: 60
      working-directory: '${{ github.workspace }}'
      run: |
        python opencv_extra/testdata/dnn/download_models.py \
          --cleanup \
          --dst '${{ env.DNN_MODELS }}/dnn'
        echo "OPENCV_DNN_TEST_DATA_PATH=${{ env.DNN_MODELS }}" >> $GITHUB_ENV

    # TEMP (diagnostic, REVERT before merge): inject a plain, minimal probe
    # isolating one specific question -- does Concurrency::parallel_for's
    # spawn/join relationship reliably make a value written by the calling
    # thread immediately before dispatch visible to every worker lambda, with
    # zero explicit synchronization on our part? This is a direct analog of
    # modules/core/src/parallel.cpp:214 (the write) and :340 (the read),
    # stripped down to nothing else -- if it races here, on this exact CI
    # hardware, the gap is in PPL/ConcRT's runtime itself, not in anything
    # OpenCV's parallel.cpp does. Ran clean (0 stale / 200,000,000 reads) on a
    # local Snapdragon X (Oryon) machine; this runner is different silicon
    # (the Cobalt 100/Neoverse-class chip the original Core_Rand failure was
    # actually observed on), so that result doesn't settle the question here.
    - name: (TEMP) Add ctx-handoff probe test
      if: ${{ matrix.arch == 'arm64' }}
      shell: bash
      working-directory: '${{ github.workspace }}'
      run: |
        cat > opencv/modules/core/test/test_ctx_handoff_probe.cpp <<'EOF'
        #include "test_precomp.hpp"
        #if defined(_WIN32) && defined(_MSC_VER) && _MSC_VER >= 1600
        #include <ppl.h>
        #include <atomic>

        namespace opencv_test { namespace {

        TEST(CtxHandoffProbe, repeated_trials)
        {
            const int NUM_ROWS = 1000;
            const long long NUM_TRIALS = 50000;
            long long ctxValue = -1;
            std::atomic<long long> totalReads{0};
            std::atomic<long long> staleReads{0};
            long long firstStaleTrial = -1;
            long long firstStaleObserved = -1;

            printf("=== CTX HANDOFF PROBE: starting %lld trials x %d workers ===\n", NUM_TRIALS, NUM_ROWS);

            for (long long trial = 0; trial < NUM_TRIALS; ++trial)
            {
                ctxValue = trial;
                Concurrency::parallel_for(0, NUM_ROWS, [&](int) {
                    long long observed = ctxValue;
                    totalReads.fetch_add(1, std::memory_order_relaxed);
                    if (observed != trial)
                    {
                        long long prevStale = staleReads.fetch_add(1, std::memory_order_relaxed);
                        if (prevStale == 0) { firstStaleTrial = trial; firstStaleObserved = observed; }
                    }
                });
            }

            long long total = totalReads.load();
            long long stale = staleReads.load();
            printf("=== CTX HANDOFF PROBE RESULT: total=%lld stale=%lld pct=%.6f ===\n",
                   total, stale, total ? 100.0 * (double)stale / (double)total : 0.0);
            if (stale > 0)
                printf("=== CTX HANDOFF PROBE FIRST STALE: trial=%lld observed=%lld ===\n",
                       firstStaleTrial, firstStaleObserved);
        }

        }} // namespace
        #endif // _WIN32 && _MSC_VER
        EOF
        echo "wrote probe:"; ls -l opencv/modules/core/test/test_ctx_handoff_probe.cpp

    # TEMP (diagnostic, REVERT before merge): inject a core-to-core cache-line
    # ping-pong probe into core/test (auto-globbed into opencv_test_core), to
    # directly measure cross-core write-visibility latency on this runner in
    # nanoseconds, for every pair of logical processors. See CI273.md for why:
    # comparing this runner's real numbers against Oryon's published/measured
    # cluster-vs-cross-cluster latency figures, using the identical benchmark
    # code on both machines, closes the gap of comparing two different tools.
    - name: (TEMP) Add core-to-core latency probe test
      if: ${{ matrix.arch == 'arm64' }}
      shell: bash
      working-directory: '${{ github.workspace }}'
      run: |
        cat > opencv/modules/core/test/test_core_latency_probe.cpp <<'EOF'
        #include "test_precomp.hpp"
        #if defined(_WIN32)
        #include <windows.h>
        #include <atomic>
        #include <chrono>
        #include <thread>

        namespace opencv_test { namespace {

        struct alignas(64) PingPongSlot
        {
            std::atomic<uint64_t> value{0};
            char pad[64 - sizeof(std::atomic<uint64_t>)];
        };

        static void measurePairLatencyNs(int cpuA, int cpuB, int rounds)
        {
            PingPongSlot a, b;
            std::atomic<bool> readyB{false};

            std::thread tB([&]() {
                SetThreadAffinityMask(GetCurrentThread(), (DWORD_PTR)1 << cpuB);
                readyB = true;
                for (int i = 1; i <= rounds; ++i)
                {
                    while (a.value.load(std::memory_order_acquire) != (uint64_t)i) {}
                    b.value.store((uint64_t)i, std::memory_order_release);
                }
            });
            std::thread tA([&]() {
                SetThreadAffinityMask(GetCurrentThread(), (DWORD_PTR)1 << cpuA);
                while (!readyB) {}
                auto t0 = std::chrono::high_resolution_clock::now();
                for (int i = 1; i <= rounds; ++i)
                {
                    a.value.store((uint64_t)i, std::memory_order_release);
                    while (b.value.load(std::memory_order_acquire) != (uint64_t)i) {}
                }
                auto t1 = std::chrono::high_resolution_clock::now();
                double totalNs = std::chrono::duration<double, std::nano>(t1 - t0).count();
                printf("PAIR cpu%d-cpu%d one_way_ns=%.1f\n", cpuA, cpuB, totalNs / (2.0 * rounds));
            });
            tA.join();
            tB.join();
        }

        TEST(CoreLatencyProbe, all_pairs)
        {
            SYSTEM_INFO si;
            GetSystemInfo(&si);
            int n = (int)si.dwNumberOfProcessors;
            printf("=== CORE LATENCY PROBE: logical_processors=%d ===\n", n);
            const int rounds = 200000;
            for (int i = 0; i < n; ++i)
                for (int j = i + 1; j < n; ++j)
                    measurePairLatencyNs(i, j, rounds);
            printf("=== END CORE LATENCY PROBE ===\n");
        }

        }} // namespace
        #endif // _WIN32
        EOF
        echo "wrote probe:"; ls -l opencv/modules/core/test/test_core_latency_probe.cpp

    - if: ${{ github.event.repository.name != 'opencv_contrib' }}
      name: Configure and build OpenCV
      uses: ./configure-and-build
      with:
        workdir: '${{ github.workspace }}'
        builddir: 'build'
        generator: '${{ matrix.vs }}'
        options: '-A ${{ matrix.cmake_arch }} ${{ env.CMAKE_OPT }}'

    # TEMP (diagnostic, REVERT before merge): skip the contrib build for
    # faster iteration on the core-latency probe experiment.
    - if: false
      name: Configure and build OpenCV with contrib
      uses: ./configure-and-build
      with:
        workdir: '${{ github.workspace }}'
        builddir: 'build-contrib'
        generator: '${{ matrix.vs }}'
        options: '-A ${{ matrix.cmake_arch }} -DCMAKE_BUILD_TYPE=Release -DOPENCV_EXTRA_MODULES_PATH=opencv_contrib/modules ${{ env.CMAKE_OPT }}'

    # TEMP (diagnostic, REVERT before merge): run only the probe, filtered so
    # it does not also run the rest of opencv_test_core's own test cases.
    - name: (TEMP) Run core-to-core latency probe
      if: ${{ always() && matrix.arch == 'arm64' }}
      working-directory: '${{ github.workspace }}'
      shell: bash
      run: ./build/bin/Release/opencv_test_core.exe --gtest_filter='CoreLatencyProbe.*'

    # TEMP (diagnostic, REVERT before merge): run the standalone ctx-handoff
    # probe injected above, on the actual CI hardware this whole question is
    # about.
    - name: (TEMP) Run ctx-handoff probe
      if: ${{ always() && matrix.arch == 'arm64' }}
      working-directory: '${{ github.workspace }}'
      shell: bash
      run: ./build/bin/Release/opencv_test_core.exe --gtest_filter='CtxHandoffProbe.*'

    # TEMP (diagnostic, REVERT before merge): the real, unmodified OpenCV test
    # this whole investigation started from -- repeated 2000x in one process,
    # closer to the actual conditions (real-sized context object, OpenCV's
    # full layered dispatch, not a stripped-down analog) than the probe above.
    # Never confirmed locally on Snapdragon/Oryon either -- every prior
    # failure came only from official CI on this runner's hardware.
    - name: (TEMP) Run Core_Rand.parallel_for_stable_results repeated
      if: ${{ always() && matrix.arch == 'arm64' }}
      working-directory: '${{ github.workspace }}'
      shell: bash
      run: ./build/bin/Release/opencv_test_core.exe --gtest_filter='Core_Rand.parallel_for_stable_results' --gtest_repeat=2000

    - name: Run OpenCV tests
      uses: ./run-tests
      env:
        OPENCV_TEST_DATA_PATH: '${{ github.workspace }}/opencv_extra/testdata'
        OPENCV_TEST_REQUIRE_DATA: ${{ matrix.arch == 'arm64' && '0' || '1' }}
        OPENCV_TEST_CHECK_OPTIONAL_DATA: ${{ matrix.arch == 'arm64' && '0' || '1' }}
        PYTHONPATH: '${{ github.workspace }}/${{ env.MAIN_BUILD_DIR }}/python_loader:$PYTHONPATH'
        OPENCV_OPENCL_RUNTIME: 'disabled'
      with:
        workdir: '${{ github.workspace }}'
        builddir: '${{ env.MAIN_BUILD_DIR }}'
        logdir: '${{ github.workspace }}'
        plan: "test-plan-win-${{ matrix.branch }}.json"
        suite: "[ ${{ (github.event.repository.name == 'opencv_contrib') && '''contrib'''  || '''main''' }} ]"
        enable_python: "false"
        enable_java: "false"
        filter: "[ 'windows-common' ]"
        suffix: '${{ matrix.arch }}_${{ matrix.branch }}'
        timeout: 15

    - if: ${{ always() && env.WARNINGS == '1' }}
      name: Warnings check
      run: |
        echo "::error Warnings have been found!"
        exit 1
