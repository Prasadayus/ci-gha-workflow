name: OCV PR Windows

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/OCV-PR-Windows.yaml'
      # TODO: are following paths necessary?
      - 'checkout-and-merge/*'
      - 'configure-and-build/*'
      - 'run-tests/*'
      - 'scripts/runner.py'
      - 'scripts/test-plan.json'
  workflow_call:
    inputs:
      workflow_branch:
        description: "Branch for ci-gha-workflow repository"
        default: "main"
        required: false
        type: string

concurrency:
  group: OCV-PR-Windows-${{ github.ref }}
  cancel-in-progress: true

jobs:

  branch_eval:
    runs-on: ubuntu-24.04
    outputs:
      branches: ${{ steps.determine-branches.outputs.branches }}
    steps:
        - id: determine-branches
          shell: bash
          run: |
            if [ "${{ github.event.repository.name == 'ci-gha-workflow' }}" = "true" ] ; then
              echo "branches=[ '4.x', '5.x' ]" >> "$GITHUB_OUTPUT"
            else
              echo "branches=[ '${{ github.base_ref }}' ]" >> "$GITHUB_OUTPUT"
            fi

  Windows:
    runs-on: ${{ matrix.runner }}
    needs:
      - branch_eval
    strategy:
      # NOTE: Debugging
      # fail-fast: true
      fail-fast: false
      max-parallel: 3
      matrix:
        arch: [ arm64 ]
        config: [ base ]
        include:
          - arch: arm64
            config: base
            runner: windows-11-arm
            vs: 'Visual Studio 17 2022'
            cmake_arch: ARM64
            no_opencl: true

        branch: ${{ fromJSON(needs.branch_eval.outputs.branches )}}
    defaults:
      run:
        shell: bash
    env:
      # Windows-ARM64 default parallel backend (ms-concurrency/PPL) has a latent,
      # timing-dependent data race that only manifests on the windows-11-arm runner
      # (~13-51 test failures across 8 modules, non-deterministic, scales with thread
      # count; absent on Linux-ARM64/macOS-ARM64/local Windows-ARM64 hardware). Switching
      # to OpenMP avoids it: OpenCV's parallel.cpp backend-selection #elif chain picks
      # OpenMP over ms-concurrency whenever OpenMP is enabled, no other change needed.
      # See opencv/opencv issue <TBD> for the full investigation.
      CMAKE_OPT: >-
        -DCL_Z_OPTION=/Z7
        -DBUILD_EXAMPLES=ON
        -DOPENCV_ENABLE_NONFREE=ON
        -DCMAKE_BUILD_TYPE=Release
        ${{ matrix.no_opencl && '-DWITH_OPENCL=OFF' || '' }}
        ${{ matrix.arch == 'x86' && '-DBUILD_opencv_python3=OFF' || '' }}
        ${{ matrix.arch == 'arm64' && '-DWITH_OPENMP=ON' || '' }}
      MAIN_BUILD_DIR: "${{ (github.event.repository.name != 'opencv_contrib') && 'build' || 'build-contrib' }}"
      OPENCV_FOR_THREADS_NUM: 8
      CMAKE_BUILD_PARALLEL_LEVEL: 8

    # ==========

    steps:

    - name: Propagate environment
      run: |
        echo "GIT_CACHE=$(cygpath -u "$GIT_CACHE")" >> "$GITHUB_ENV"
        echo "DNN_MODELS=$(cygpath -u "$DNN_MODELS")" >> "$GITHUB_ENV"
        echo "BINARIES_CACHE=$(cygpath -u "$BINARIES_CACHE")" >> "$GITHUB_ENV"
        echo "OPENCV_DOWNLOAD_PATH=$(cygpath -u "$BINARIES_CACHE")" >> "$GITHUB_ENV"


    - name: Checkout workflow repository
      uses: actions/checkout@v4
      with:
        repository: opencv/ci-gha-workflow
        ref: "${{ github.repository == 'opencv/ci-gha-workflow' && github.ref || inputs.workflow_branch }}"

    - working-directory: '${{ github.workspace }}'
      shell: bash
      run: |
        ls -l
        export
        whoami
        id
        which bash
        echo "GIT_CACHE=$GIT_CACHE"
        echo "DNN_MODELS=$DNN_MODELS"
        echo "BINARIES_CACHE=$BINARIES_CACHE"
        echo "OPENCV_DOWNLOAD_PATH=$BINARIES_CACHE"


    - name: Checkout and merge OpenCV
      uses: ./checkout-and-merge
      with:
        target_branch: '${{ matrix.branch }}'
        author: '${{ github.event.pull_request.user.login }}'
        source_branch: "${{ github.event.repository.name == 'ci-gha-workflow' && '' || github.head_ref }}"
        gitcache: '${{ env.GIT_CACHE }}'
        workdir: '${{ github.workspace }}'

    - name: Update extra dnn models
      if: ${{ matrix.arch != 'arm64' }}
      timeout-minutes: 60
      working-directory: '${{ github.workspace }}'
      run: |
        python opencv_extra/testdata/dnn/download_models.py \
          --cleanup \
          --dst '${{ env.DNN_MODELS }}/dnn'
        echo "OPENCV_DNN_TEST_DATA_PATH=${{ env.DNN_MODELS }}" >> $GITHUB_ENV

    # The windows-11-arm runner has C:\mingw64\bin on PATH. OpenCV enables the ASM
    # language, CMake searches PATH for an assembler, finds mingw's cc.exe, IDs it as
    # GNU, and sets MINGW=true even though C/C++ actually compile with MSVC. That flips
    # the link line to GNU-style flags (-ld3d11, -lgdi32, ...) which MSVC's linker
    # silently ignores, breaking the DirectX interop samples (LNK2019/LNK1120).
    - name: Remove MinGW from PATH (ARM64 MSVC build)
      if: ${{ matrix.arch == 'arm64' }}
      shell: bash
      run: echo "PATH=$(echo "$PATH" | tr ':' '\n' | grep -v -i '/mingw' | paste -sd ':')" >> "$GITHUB_ENV"

    # Runner HW identity for this job, for reference when investigating ARM64-specific
    # behavior (this runner's failures did not reproduce on other ARM64 platforms/hardware).
    - name: Print runner CPU model (ARM64)
      if: ${{ matrix.arch == 'arm64' }}
      shell: pwsh
      run: Get-CimInstance Win32_Processor | Select-Object Name, Manufacturer, NumberOfCores, NumberOfLogicalProcessors | Format-List

    - if: ${{ github.event.repository.name != 'opencv_contrib' }}
      name: Configure and build OpenCV
      uses: ./configure-and-build
      with:
        workdir: '${{ github.workspace }}'
        builddir: 'build'
        generator: '${{ matrix.vs }}'
        options: '-A ${{ matrix.cmake_arch }} ${{ env.CMAKE_OPT }}'

    # Guard against silently regressing back to ms-concurrency (e.g. if a future runner
    # image drops OpenMP support): every opencv_test_* binary prints "Parallel framework: "
    # unconditionally at startup (modules/ts/src/ts.cpp), so a trivial no-test invocation
    # is enough to check it without waiting for the full suite.
    - name: Verify ARM64 parallel backend is OpenMP
      if: ${{ github.event.repository.name != 'opencv_contrib' && matrix.arch == 'arm64' }}
      working-directory: '${{ github.workspace }}'
      shell: bash
      run: |
        ./build/bin/Release/opencv_test_core.exe --gtest_filter='-*' 2>&1 | tee parallel_backend.log
        if ! grep -q "Parallel framework: openmp" parallel_backend.log; then
          echo "::error::ARM64 build did not select the OpenMP parallel backend (expected from -DWITH_OPENMP=ON). This job depends on OpenMP to avoid a known ms-concurrency (PPL) race on Windows-ARM64 -- see opencv/opencv issue <TBD>."
          exit 1
        fi

    - name: Configure and build OpenCV with contrib
      uses: ./configure-and-build
      with:
        workdir: '${{ github.workspace }}'
        builddir: 'build-contrib'
        generator: '${{ matrix.vs }}'
        options: '-A ${{ matrix.cmake_arch }} -DCMAKE_BUILD_TYPE=Release -DOPENCV_EXTRA_MODULES_PATH=opencv_contrib/modules ${{ env.CMAKE_OPT }}'

    - name: Run OpenCV tests
      uses: ./run-tests
      env:
        OPENCV_TEST_DATA_PATH: '${{ github.workspace }}/opencv_extra/testdata'
        OPENCV_TEST_REQUIRE_DATA: ${{ matrix.arch == 'arm64' && '0' || '1' }}
        OPENCV_TEST_CHECK_OPTIONAL_DATA: ${{ matrix.arch == 'arm64' && '0' || '1' }}
        PYTHONPATH: '${{ github.workspace }}/${{ env.MAIN_BUILD_DIR }}/python_loader:$PYTHONPATH'
        OPENCV_OPENCL_RUNTIME: 'disabled'
      with:
        workdir: '${{ github.workspace }}'
        builddir: '${{ env.MAIN_BUILD_DIR }}'
        logdir: '${{ github.workspace }}'
        plan: "test-plan-win-${{ matrix.branch }}.json"
        suite: "[ ${{ (github.event.repository.name == 'opencv_contrib') && '''contrib'''  || '''main''' }} ]"
        enable_python: "false"
        enable_java: "false"
        filter: "[ 'windows-common' ]"
        suffix: '${{ matrix.arch }}_${{ matrix.branch }}'
        timeout: 15

    - if: ${{ always() && env.WARNINGS == '1' }}
      name: Warnings check
      run: |
        echo "::error Warnings have been found!"
        exit 1
